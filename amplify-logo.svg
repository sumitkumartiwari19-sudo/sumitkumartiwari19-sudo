<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
<title id="title">AMPLIFY Music Media</title>
<desc id="desc">Gold audio waveform emblem and AMPLIFY Music Media wordmark on a transparent background.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#d8ad45"/><stop offset="1" stop-color="#8d6420"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path stroke-width="7" d="M42 90h70l22-30 24 68 31-104 29 137 25-78 20 35h60"/>
  <path stroke-width="2" opacity=".55" d="M42 90h70l22-30 24 68 31-104 29 137 25-78 20 35h60"/>
</g>
<text x="360" y="190" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="9">AMPLIFY</text>
<text x="360" y="228" text-anchor="middle" fill="#d7c18c" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="11">MUSIC MEDIA</text>
</svg>